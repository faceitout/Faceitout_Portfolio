<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Project 02 | Portfolio</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&icon_names=close,dark_mode,light_mode,menu"
  />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>

<body class="project-page-body" data-project="project02">
  <div class="site-wrapper project-site">
    <main class="project">
      <header class="project-header" aria-label="Cabecera proyecto">
        <div class="project-header__left">
          <a class="project-brand" href="./home.html" aria-label="faceitout home">
            <img
              class="project-brand__image"
              id="projectLogo"
              src="./assets/images/LOGO.svg"
              alt="faceitout"
            />
          </a>

          <nav class="project-nav" aria-label="Navegación principal proyecto">
            <ul class="project-nav__list" id="projectMenu"></ul>
          </nav>
        </div>

        <button
          class="project-mobile-menu-word"
          type="button"
          data-project-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="projectMobileMenuPanel"
          aria-expanded="false"
        >
          WORKS
        </button>

        <a
          class="project-start"
          id="projectStartProject"
          href="mailto:almudenaestevez23@gmail.com"
        >
          START A PROJECT
        </a>

        <button
          class="project-mobile-menu-button"
          id="projectMobileMenuToggle"
          type="button"
          data-project-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="projectMobileMenuPanel"
          aria-expanded="false"
        >
          <span class="project-mobile-menu-button__line"></span>
          <span class="project-mobile-menu-button__line"></span>
        </button>
      </header>

      <div
        class="project-mobile-menu-panel"
        id="projectMobileMenuPanel"
        aria-hidden="true"
      >
        <nav class="project-mobile-menu-nav" aria-label="Menú móvil proyecto">
          <ul class="project-mobile-menu-list" id="projectMobileMenu"></ul>
        </nav>

        <nav
          class="project-mobile-menu-social"
          aria-label="Redes sociales móvil"
          id="projectMobileSocial"
        ></nav>

        <p class="project-mobile-menu-credit" id="projectMobileCredit"></p>
      </div>

      <section class="project-page" id="projectDetail" aria-label="Detalle del proyecto"></section>

      <footer class="project-footer" aria-label="Footer proyecto">
        <p class="project-footer__copyright" id="projectCopyright"></p>

        <nav
          class="project-footer__social"
          aria-label="Redes sociales proyecto"
          id="projectSocial"
        ></nav>

        <p class="project-footer__credit" id="projectCredit"></p>
      </footer>
    </main>
  </div>

  <div class="custom-cursor" id="customCursor">
    <span class="custom-cursor__label">View</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/Draggable.min.js"></script>
  <script src="./web/main.js" defer></script>
  <script src="./web/site-motion.js" defer></script>
  <script src="./web/projects.js" defer></script>
  
</body>
</html>
