<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Works | Portfolio</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&icon_names=close,dark_mode,light_mode,menu"
  />

  <link rel="stylesheet" href="./assets/css/main.css" />
</head>

<body class="work-page">
  <div class="site-wrapper work-site">
    <main class="work">
      <header class="work-header" aria-label="Cabecera works">
        <div class="work-header__left">
          <a class="work-brand" href="./home.html" aria-label="faceitout home">
            <img
              class="work-brand__image"
              id="workLogo"
              src="./assets/images/LOGO.svg"
              alt="faceitout"
            />
          </a>

          <nav class="work-nav" aria-label="Navegación principal works">
            <ul class="work-nav__list" id="workMenu"></ul>
          </nav>
        </div>

        <button
          class="work-mobile-menu-word"
          type="button"
          data-work-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="workMobileMenuPanel"
          aria-expanded="false"
        >
          WORKS
        </button>

        <a
          class="work-start"
          id="workStartProject"
          href="mailto:almudenaestevez23@gmail.com"
        >
          START A PROJECT
        </a>

        <button
          class="work-mobile-menu-button"
          id="workMobileMenuToggle"
          type="button"
          data-work-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="workMobileMenuPanel"
          aria-expanded="false"
        >
          <span class="work-mobile-menu-button__line"></span>
          <span class="work-mobile-menu-button__line"></span>
        </button>
      </header>

      <div
        class="work-mobile-menu-panel"
        id="workMobileMenuPanel"
        aria-hidden="true"
      >
        <nav class="work-mobile-menu-nav" aria-label="Menú móvil works">
          <ul class="work-mobile-menu-list" id="workMobileMenu"></ul>
        </nav>

        <nav
          class="work-mobile-menu-social"
          aria-label="Redes sociales móvil"
          id="workMobileSocial"
        ></nav>

        <p class="work-mobile-menu-credit" id="workMobileCredit"></p>
      </div>

      <section class="work-hero" aria-labelledby="workPageTitle">
        <h1 class="work-title" id="workPageTitle">SELECTED WORKS</h1>

        <section
          class="work-grid"
          id="workGrid"
          aria-label="Listado de proyectos"
        ></section>
      </section>

      <section class="work-gallery-cta" aria-label="Explorar galería">
        <a
          class="work-gallery-cta__link"
          id="workGalleryCta"
          href="./gallery.html"
        >
          EXPLORE THE<br />
          GALLERY
        </a>
      </section>

      <footer class="work-footer" aria-label="Footer works">
        <p class="work-footer__copyright" id="workCopyright"></p>

        <nav
          class="work-footer__social"
          aria-label="Redes sociales works"
          id="workSocial"
        ></nav>

        <p class="work-footer__credit" id="workCredit"></p>
      </footer>
    </main>
  </div>

  <div class="custom-cursor" id="customCursor">
    <span class="custom-cursor__label">View</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/Draggable.min.js"></script>
  <script src="./web/main.js" defer></script>
  <script src="./web/site-motion.js" defer></script>
  <script src="./web/work.js" defer></script>
  
</body>
</html>
