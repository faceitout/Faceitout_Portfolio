<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>About | Portfolio</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&icon_names=close,dark_mode,light_mode,menu"
  />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>

<body class="about-page-body">
  <div class="site-wrapper about-site">
    <main class="about">
      <header class="about-header" aria-label="Cabecera about">
        <div class="about-header__left">
          <a class="about-brand" href="./home.html" aria-label="faceitout home">
            <img
              class="about-brand__image"
              id="aboutLogo"
              src="./assets/images/LOGO.svg"
              alt="faceitout"
            />
          </a>

          <nav class="about-nav" aria-label="Navegación principal about">
            <ul class="about-nav__list" id="aboutMenu"></ul>
          </nav>
        </div>

        <button
          class="about-mobile-menu-word"
          type="button"
          data-about-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="aboutMobileMenuPanel"
          aria-expanded="false"
        >
          ABOUT
        </button>

        <a
          class="about-start"
          id="aboutStartProject"
          href="mailto:almudenaestevez23@gmail.com"
        >
          START A PROJECT
        </a>

        <button
          class="about-mobile-menu-button"
          id="aboutMobileMenuToggle"
          type="button"
          data-about-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="aboutMobileMenuPanel"
          aria-expanded="false"
        >
          <span class="about-mobile-menu-button__line"></span>
          <span class="about-mobile-menu-button__line"></span>
        </button>
      </header>

      <div
        class="about-mobile-menu-panel"
        id="aboutMobileMenuPanel"
        aria-hidden="true"
      >
        <nav class="about-mobile-menu-nav" aria-label="Menú móvil about">
          <ul class="about-mobile-menu-list" id="aboutMobileMenu"></ul>
        </nav>

        <nav
          class="about-mobile-menu-social"
          aria-label="Redes sociales móvil"
          id="aboutMobileSocial"
        ></nav>

        <p class="about-mobile-menu-credit" id="aboutMobileCredit"></p>
      </div>

      <section class="about-page" id="aboutDetail" aria-label="Sobre mí"></section>

      <footer class="about-footer" aria-label="Footer about">
        <p class="about-footer__copyright" id="aboutCopyright"></p>

        <nav
          class="about-footer__social"
          aria-label="Redes sociales about"
          id="aboutSocial"
        ></nav>

        <p class="about-footer__credit" id="aboutCredit"></p>
      </footer>
    </main>
  </div>

  <div class="custom-cursor" id="customCursor">
    <span class="custom-cursor__label">View</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/Draggable.min.js"></script>
  <script src="./web/main.js" defer></script>
  <script src="./web/site-motion.js" defer></script>
  <script src="./web/about.js" defer></script>
  
</body>
</html>
