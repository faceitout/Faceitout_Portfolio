<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home | Portfolio</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&icon_names=close,dark_mode,light_mode,menu"
  />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>

<body class="home-page">
  <div class="site-wrapper home-site">
    <main class="home">
      <header class="home-header" aria-label="Cabecera home">
        <div class="home-header__left">
          <a class="home-brand" href="./home.html" aria-label="faceitout home">
            <img
              class="home-brand__image"
              src="./assets/images/LOGO.svg"
              alt="faceitout"
            />
          </a>

          <nav class="home-nav" aria-label="Navegación principal home">
            <ul class="home-nav__list" id="homeMenu"></ul>
          </nav>
        </div>

        <button
          class="home-mobile-menu-word"
          type="button"
          data-home-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="homeMobileMenuPanel"
          aria-expanded="false"
        >
          HOME
        </button>

        <a
          class="home-start"
          id="homeStartProject"
          href="mailto:almudenaestevez23@gmail.com"
        >
          START A PROJECT
        </a>

        <button
          class="home-mobile-menu-button"
          id="homeMobileMenuToggle"
          type="button"
          data-home-mobile-toggle
          aria-label="Abrir menú"
          aria-controls="homeMobileMenuPanel"
          aria-expanded="false"
        >
          <span class="home-mobile-menu-button__line"></span>
          <span class="home-mobile-menu-button__line"></span>
        </button>
      </header>

      <div
        class="home-mobile-menu-panel"
        id="homeMobileMenuPanel"
        aria-hidden="true"
      >
        <nav class="home-mobile-menu-nav" aria-label="Menú móvil home">
          <ul class="home-mobile-menu-list" id="homeMobileMenu"></ul>
        </nav>

        <nav
          class="home-mobile-menu-social"
          aria-label="Redes sociales móvil"
          id="homeMobileSocial"
        ></nav>

        <p class="home-mobile-menu-credit" id="homeMobileCredit"></p>
      </div>

      <section class="home-hero" aria-label="Home visual">
        <div class="home-hero__stage" id="homeHeroStage"></div>
      </section>

      <footer class="home-footer" aria-label="Footer home">
        <p class="home-footer__copyright" id="homeCopyright"></p>

        <nav
          class="home-footer__social"
          aria-label="Redes sociales home"
          id="homeSocial"
        ></nav>

        <p class="home-footer__credit" id="homeCredit"></p>
      </footer>
    </main>
  </div>

  <div class="custom-cursor" id="customCursor">
    <span class="custom-cursor__label">View</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.3/Draggable.min.js"></script>
  <script src="./web/main.js" defer></script>
  <script src="./web/site-motion.js" defer></script>
  <script src="./web/home.js" defer></script>
  
</body>
</html>
